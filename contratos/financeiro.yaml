openapi: 3.1.0
info:
  title: Financeiro — Módulo
  version: 0.4.0
  summary: Contas a receber e a pagar, cobrança recorrente, pagamentos, régua, inadimplência, MRR e auditoria.
  description: |
    API do módulo Financeiro (código `financeiro`, Grupo 8) do Projeto Integrador 2026.

    Segue o Contrato de Integração dos Módulos: rotas sob `/api/financeiro`, envelope
    `{ success, data, message, errors }` em toda resposta (inclusive 401 e 403), JWT RS256 validado
    via JWKS, `tenant_id` sempre do claim do token (com token de serviço, do cabeçalho `X-Tenant-Id`),
    listagem paginada (máx. 100), e registro de outro tenant respondendo 404 (nunca 403).

    Escopo: Fase 2 da EOR v1.0 (Especificação de Requisitos do Financeiro) — RF-01 a RF-13.
    Contabilidade, Comissões e Conciliação ficam fora (PD-1, PD-6, §32).

    Valores monetários com no máximo 2 casas decimais: acima disso a API responde 400 com
    `PRECISAO_EXCEDIDA` e nada é gravado (RN-07). Percentuais em pontos (12.5 = 12,5%).
    Download de arquivo é a única exceção ao envelope.

    Integrações de leitura para outros módulos (tag `integracoes`): status financeiro da empresa
    para a ficha do CRM (§10.4), com a permissão fraca `financeiro.cobranca.ver_resumo` (§9.3) e
    versão em lote (§9.4).

    Superfície pública: o webhook do provedor de pagamento fica sob `/public/financeiro/**`, único
    prefixo dispensado de token no gateway (§12.6).

    Mudanças da 0.4.0 (alinhamento à EOR v1.0): baixa manual de cobrança (RF-12), registro do
    pagamento de conta a pagar (RF-02), consulta da auditoria (RF-13), histórico de pagamentos,
    disparos da régua e promessas por cobrança (RF-01, RF-06, RF-07), histórico do MRR (RF-08);
    `categoria` e `centroCusto` de conta a pagar passam a texto livre (PD-5: sem cadastro);
    `contratoId` da regra de recorrência fica opcional enquanto o Contratos não publica a
    assinatura; a etapa da régua não exige `id` na entrada; pedido de pagamento para cobrança paga
    ou cancelada responde 409; campos novos só acrescentados nas respostas.
  license:
    name: Uso acadêmico — Projeto Integrador 2026
    identifier: LicenseRef-Academico
servers:
  - url: http://localhost:8080
    description: Pelo gateway
  - url: http://financeiro:8085
    description: Direto, entre serviços
tags:
  - name: saude
    description: Estado do serviço
  - name: busca
    description: Busca global — formato padrão id/titulo/subtitulo/rota
  - name: integracoes
    description: Endpoints consumidos por outros módulos — ficha de empresa do CRM
  - name: contas-a-receber
    description: Cobranças emitidas a empresas clientes (RF-01, RF-11, RF-12)
  - name: contas-a-pagar
    description: Despesas com fornecedores (RF-02)
  - name: recorrencia
    description: Regras de cobrança recorrente (RF-03)
  - name: pagamentos
    description: Pedido de pagamento pelo adaptador de provedor, simulado nesta fase (RF-04)
  - name: webhooks
    description: Callbacks de provedores de pagamento — rota pública, sem token (RF-05)
  - name: regua
    description: Régua de cobrança (RF-06)
  - name: inadimplencia
    description: Inadimplência, aging e promessas de pagamento (RF-07)
  - name: mrr-dashboard
    description: MRR decomposto e indicadores da home do financeiro (RF-08)
  - name: auditoria
    description: Quem alterou o quê (RF-13)

security:
  - bearerJwt: []

paths:
  /api/financeiro/health:
    get:
      tags: [saude]
      operationId: saude
      summary: Serviço de pé e conectado ao banco
      security: []
      responses:
        '200':
          description: Disponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { success: true, data: { status: UP }, message: null, errors: [] }
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/financeiro/busca:
    get:
      tags: [busca]
      operationId: buscarFinanceiro
      summary: Busca global — cobranças e contas a pagar por texto
      description: >
        Exige `financeiro.acessar`. Cada tipo de resultado só aparece para quem pode ler aquele
        recurso: cobranças com `financeiro.contareceber.ver`, contas a pagar com
        `financeiro.contapagar.ver` — o subtítulo mostra valor, por isso não basta a permissão fraca.
        No máximo 5 resultados, cada um com id, titulo, subtitulo e rota (relativa ao módulo).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        '200':
          description: Resultados da busca (até 5)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        maxItems: 5
                        items: { $ref: '#/components/schemas/ResultadoBusca' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/relatorios/cobrancas/exportar:
    get:
      tags: [contas-a-receber]
      operationId: exportarRelatorioCobrancas
      summary: Exportar contas a receber em PDF, XLSX ou CSV
      description: >
        Exige `financeiro.relatorio.exportar`. Única exceção ao envelope padrão — devolve o arquivo
        diretamente. Respeita o tenant e os filtros (RN-58). Erros continuam no envelope.
      parameters:
        - name: formato
          in: query
          required: true
          schema: { type: string, enum: [pdf, xlsx, csv] }
        - name: vencimentoInicio
          in: query
          schema: { type: string, format: date }
        - name: vencimentoFim
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusCobranca' }
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Arquivo gerado (sem envelope)
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/cobrancas:
    get:
      tags: [contas-a-receber]
      operationId: listarCobrancas
      summary: Listar cobranças do tenant
      description: >
        Exige `financeiro.contareceber.ver`. Canceladas saem da listagem padrão (RN-04) e aparecem
        com `status=CANCELADO`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusCobranca' }
        - name: vencimentoInicio
          in: query
          schema: { type: string, format: date }
        - name: vencimentoFim
          in: query
          schema: { type: string, format: date }
        - name: recorrenciaId
          in: query
          schema: { type: string, format: uuid }
        - name: ordenar
          in: query
          schema:
            type: string
            enum: ['vencimento,asc', 'vencimento,desc', 'criadoEm,desc']
            default: 'vencimento,asc'
      responses:
        '200':
          description: Página de cobranças
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/Cobranca' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [contas-a-receber]
      operationId: criarCobranca
      summary: Lançar uma cobrança avulsa
      description: >
        Exige `financeiro.contareceber.criar`. Toda cobrança nasce com uma empresa do CRM (RN-03).
        Publica `financeiro.cobranca.criada` depois do commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobrancaEntrada' }
      responses:
        '201':
          description: Cobrança criada
          headers:
            Location:
              schema: { type: string, example: /api/financeiro/cobrancas/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Cobranca' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/cobrancas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contas-a-receber]
      operationId: verCobranca
      summary: Ver uma cobrança
      description: Exige `financeiro.contareceber.ver`. Cobrança de outro tenant responde 404.
      responses:
        '200':
          description: Cobrança
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Cobranca' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [contas-a-receber]
      operationId: editarCobranca
      summary: Editar uma cobrança
      description: >
        Exige `financeiro.contareceber.editar`. Só em ABERTO, AGENDADO ou PARCIAL; em PARCIAL o
        valor original e a empresa não mudam, só o saldo em aberto é editável (RN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobrancaEntrada' }
      responses:
        '200':
          description: Cobrança atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Cobranca' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }
    delete:
      tags: [contas-a-receber]
      operationId: excluirCobranca
      summary: Cancelar uma cobrança (soft delete)
      description: >
        Exige `financeiro.contareceber.excluir`. Só sem pagamento recebido (ABERTO, AGENDADO ou
        ATRASADO); pedidos pendentes no provedor são cancelados.
      responses:
        '200':
          description: Cobrança cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /api/financeiro/cobrancas/{id}/baixas:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [contas-a-receber]
      operationId: baixarCobrancaManualmente
      summary: Registrar baixa manual (transferência), total ou parcial
      description: >
        Exige `financeiro.contareceber.editar` (RF-12). Gera um pagamento TRANSFERENCIA já CONFIRMADO,
        com os mesmos efeitos do webhook: atualiza o status (PAGO ou PARCIAL), cancela avisos
        pendentes e publica `financeiro.pagamento.confirmado` (RN-60, RN-61). O comprovante fica no
        serviço de documentos; aqui vai só o UUID (RN-62).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BaixaManualEntrada' }
      responses:
        '201':
          description: Baixa registrada
          headers:
            Location: { $ref: '#/components/headers/LocationPagamento' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/financeiro/cobrancas/{id}/pagamentos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [pagamentos]
      operationId: pagamentosDaCobranca
      summary: Histórico de pagamentos da cobrança
      description: Exige `financeiro.contareceber.ver`.
      responses:
        '200':
          description: Pagamentos, do mais recente ao mais antigo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/financeiro/cobrancas/{id}/disparos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [regua]
      operationId: disparosDaCobranca
      summary: Avisos da régua já disparados para a cobrança
      description: Exige `financeiro.contareceber.ver`. Um disparo por cobrança e etapa (RN-32).
      responses:
        '200':
          description: Disparos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Disparo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/financeiro/cobrancas/{id}/promessas:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [inadimplencia]
      operationId: promessasDaCobranca
      summary: Promessas de pagamento da cobrança
      description: Exige `financeiro.contareceber.ver`.
      responses:
        '200':
          description: Promessas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Promessa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [inadimplencia]
      operationId: registrarPromessa
      summary: Registrar promessa de pagamento
      description: >
        Exige `financeiro.contareceber.editar` (RN-42). A promessa vira CUMPRIDA com o pagamento e
        QUEBRADA quando a data passa sem ele (job diário).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromessaEntrada' }
      responses:
        '201':
          description: Promessa registrada
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Promessa' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/financeiro/cobrancas/{id}/pagamento/pix:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [pagamentos]
      operationId: gerarPixCobranca
      summary: Solicitar cobrança via PIX
      description: >
        Exige `financeiro.contareceber.editar`. Valor = saldo em aberto. Cobrança PAGO, CANCELADO ou
        ESTORNADO responde 409.
      responses:
        '201':
          description: PIX gerado
          headers:
            Location: { $ref: '#/components/headers/LocationPagamento' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /api/financeiro/cobrancas/{id}/pagamento/boleto:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [pagamentos]
      operationId: gerarBoletoCobranca
      summary: Gerar boleto
      description: Exige `financeiro.contareceber.editar`. Cobrança paga ou cancelada responde 409.
      responses:
        '201':
          description: Boleto gerado
          headers:
            Location: { $ref: '#/components/headers/LocationPagamento' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /api/financeiro/cobrancas/{id}/pagamento/cartao:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [pagamentos]
      operationId: gerarCartaoCobranca
      summary: Gerar link de pagamento por cartão
      description: >
        Exige `financeiro.contareceber.editar`. Só link de pagamento: cartão recorrente (cartão salvo)
        depende da PD-4 (RN-23). O módulo nunca guarda dado de cartão (RN-22).
      responses:
        '201':
          description: Link de pagamento gerado
          headers:
            Location: { $ref: '#/components/headers/LocationPagamento' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /api/financeiro/pagamentos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [pagamentos]
      operationId: verPagamento
      summary: Consultar uma solicitação de pagamento
      description: >
        Exige `financeiro.contareceber.ver`. Destino do `Location` dos `POST .../pagamento/*` e
        `.../baixas`; serve para a tela acompanhar se o PIX ou o boleto já foi pago.
      responses:
        '200':
          description: Solicitação de pagamento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/financeiro/pagamentos/{id}/simular-confirmacao:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [pagamentos]
      operationId: simularConfirmacao
      summary: Simular a confirmação do provedor (só com o provedor simulado)
      description: >
        Exige `financeiro.contareceber.editar`. Faz o papel do provedor simulado e envia o webhook
        assinado de confirmação, para demonstrar a jornada até "pagamento recebido" sem conta de
        sandbox (RN-20). Com provedor real responde 422.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                valor: { type: number, multipleOf: 0.01, description: Padrão = valor pedido }
      responses:
        '200':
          description: Pagamento depois da confirmação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PagamentoSolicitado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /public/financeiro/webhooks/pagamento:
    post:
      tags: [webhooks]
      operationId: receberWebhookPagamento
      summary: Callback de pagamento do provedor
      security: []
      description: |
        Rota pública (§12.6), com limite de requisições por IP (429 acima dele). A assinatura é
        validada antes de qualquer processamento: inválida responde 400 e nada muda (RN-27).

        Assinatura do adaptador simulado: HMAC-SHA256, em hexadecimal minúsculo, de
        `eventoId|tipo|cobrancaId|valorPago` com o segredo compartilhado `PROVEDOR_WEBHOOK_SEGREDO`
        (`valorPago` com 2 casas, ou vazio quando ausente).

        O tenant nunca vem do payload: é o da cobrança citada (RN-26). Idempotente por `eventoId`:
        reenvio responde 200 sem criar pagamento (RN-28). Confirmado igual ao saldo leva a PAGO,
        menor leva a PARCIAL (RN-29). Publica `financeiro.pagamento.confirmado` ou
        `financeiro.pagamento.falhou` (também para estorno) depois do commit. A resposta não devolve
        dado de negócio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPagamentoEntrada' }
      responses:
        '200':
          description: Evento aceito (processado ou ignorado por já ter sido processado)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        required: [recebido]
                        properties:
                          recebido: { type: boolean, example: true }
              example: { success: true, data: { recebido: true }, message: null, errors: [] }
        '400':
          description: Assinatura inválida ou payload malformado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429':
          description: Limite de requisições por IP excedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/financeiro/contas-pagar:
    get:
      tags: [contas-a-pagar]
      operationId: listarContasPagar
      summary: Listar contas a pagar do tenant
      description: Exige `financeiro.contapagar.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: aprovado
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { type: string, enum: [PENDENTE, APROVADA, PAGA, CANCELADA] }
        - name: ordenar
          in: query
          schema:
            type: string
            enum: ['vencimento,asc', 'vencimento,desc', 'criadoEm,desc']
            default: 'vencimento,asc'
      responses:
        '200':
          description: Página de contas a pagar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/ContaPagar' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [contas-a-pagar]
      operationId: criarContaPagar
      summary: Lançar uma conta a pagar
      description: Exige `financeiro.contapagar.criar`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContaPagarEntrada' }
      responses:
        '201':
          description: Conta a pagar criada
          headers:
            Location:
              schema: { type: string, example: /api/financeiro/contas-pagar/7d1e2f3a-4b5c-4d6e-8f9a-0b1c2d3e4f5a }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ContaPagar' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/contas-pagar/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [contas-a-pagar]
      operationId: verContaPagar
      summary: Ver uma conta a pagar
      description: Exige `financeiro.contapagar.ver`.
      responses:
        '200':
          description: Conta a pagar
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ContaPagar' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/financeiro/contas-pagar/{id}/aprovar:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [contas-a-pagar]
      operationId: aprovarContaPagar
      summary: Aprovar o pagamento de uma conta a pagar
      description: >
        Exige `financeiro.contapagar.aprovar` — distinta de quem lança (RN-11). A aprovação registra
        quem aprovou e quando.
      responses:
        '200':
          description: Conta aprovada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ContaPagar' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }

  /api/financeiro/contas-pagar/{id}/pagamento:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [contas-a-pagar]
      operationId: registrarPagamentoContaPagar
      summary: Registrar o pagamento (baixa) de uma conta a pagar
      description: >
        Exige `financeiro.contapagar.criar`. Só conta aprovada (RN-12): pendente responde 422 e
        continua pendente.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagamentoContaEntrada' }
      responses:
        '200':
          description: Conta paga
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ContaPagar' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/financeiro/recorrencias:
    get:
      tags: [recorrencia]
      operationId: listarRecorrencias
      summary: Listar regras de cobrança recorrente
      description: Exige `financeiro.recorrencia.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
        - name: ativa
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Página de regras
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/RegraRecorrencia' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [recorrencia]
      operationId: criarRecorrencia
      summary: Criar uma regra de cobrança recorrente
      description: >
        Exige `financeiro.recorrencia.administrar`. A primeira competência é a do mês corrente; o job
        gera quando chega o dia de geração.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegraRecorrenciaEntrada' }
      responses:
        '201':
          description: Regra criada
          headers:
            Location:
              schema: { type: string, example: /api/financeiro/recorrencias/2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/RegraRecorrencia' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/recorrencias/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [recorrencia]
      operationId: verRecorrencia
      summary: Ver uma regra de cobrança recorrente
      description: Exige `financeiro.recorrencia.ver`.
      responses:
        '200':
          description: Regra
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/RegraRecorrencia' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [recorrencia]
      operationId: atualizarRecorrencia
      summary: Atualizar uma regra de cobrança recorrente (aditivo)
      description: >
        Exige `financeiro.recorrencia.administrar`. Os itens novos valem da próxima competência a
        gerar; cobranças já emitidas não são recalculadas (RN-17).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegraRecorrenciaEntrada' }
      responses:
        '200':
          description: Regra atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/RegraRecorrencia' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/financeiro/recorrencias/{id}/gerar-cobranca:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [recorrencia]
      operationId: gerarCobrancaRecorrencia
      summary: Disparar manualmente a geração da cobrança do ciclo atual
      description: >
        Exige `financeiro.recorrencia.administrar`. Uso de teste do job periódico. Valor recalculado
        dos itens vigentes (RN-14). Publica `financeiro.cobranca.criada` depois do commit.
      responses:
        '201':
          description: Cobrança gerada para o ciclo atual
          headers:
            Location:
              schema: { type: string, example: /api/financeiro/cobrancas/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Cobranca' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/Conflito' }
        '422': { $ref: '#/components/responses/RegraDeNegocio' }

  /api/financeiro/regua:
    get:
      tags: [regua]
      operationId: verRegua
      summary: Consultar a configuração atual da régua de cobrança
      description: Exige `financeiro.regua.ver`.
      responses:
        '200':
          description: Configuração da régua
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ReguaCobranca' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    put:
      tags: [regua]
      operationId: atualizarRegua
      summary: Substituir a configuração completa de etapas da régua
      description: >
        Exige `financeiro.regua.administrar`. Etapa com `id` existente é mantida (preserva o
        histórico de disparos); sem `id`, é criada; as que ficarem de fora são removidas.
        Deslocamento repetido ou modelo vazio responde 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReguaCobranca' }
      responses:
        '200':
          description: Régua atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ReguaCobranca' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/regua/executar:
    post:
      tags: [regua]
      operationId: executarRegua
      summary: Rodar agora o job de atraso e régua para o tenant
      description: >
        Exige `financeiro.regua.administrar`. O mesmo job roda sozinho todo dia às 7h (Brasília) para
        todos os tenants. Rodar duas vezes no mesmo dia não repete disparo nem evento de atraso.
      responses:
        '200':
          description: Resultado da execução
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/ExecucaoRegua' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/inadimplencia:
    get:
      tags: [inadimplencia]
      operationId: verInadimplencia
      summary: Painel de inadimplência com aging por faixas
      description: >
        Exige `financeiro.inadimplencia.ver`. Calculado na consulta (RN-41); PARCIAL entra pelo saldo
        (RN-39). `totalPorFaixa` considera todas as faixas; `itens` é paginado e filtrado.
      parameters:
        - name: faixa
          in: query
          schema: { $ref: '#/components/schemas/FaixaAging' }
        - name: ordenar
          in: query
          schema: { type: string, enum: [dias, valor], default: dias }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Painel de inadimplência
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/InadimplenciaResponse' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/inadimplencia/empresas/{empresaId}:
    parameters:
      - name: empresaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inadimplencia]
      operationId: historicoDaEmpresa
      summary: Histórico financeiro de uma empresa
      description: Exige `financeiro.inadimplencia.ver`. Cobranças, pagamentos, disparos da régua e promessas (RN-40).
      responses:
        '200':
          description: Histórico
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/HistoricoEmpresa' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/mrr:
    get:
      tags: [mrr-dashboard]
      operationId: verMrr
      summary: MRR decomposto do período
      description: >
        Exige `financeiro.dashboard.ver`. Novo, Expansion, Contraction, Churned e Net New (RN-43,
        RN-44), com ARR (RN-47) e churn (RN-48). O Financeiro é o dono do cálculo (PD-3).
      parameters:
        - name: periodo
          in: query
          required: true
          schema: { type: string, example: '2026-09', pattern: '^\d{4}-\d{2}$' }
          description: Formato AAAA-MM
      responses:
        '200':
          description: Decomposição do MRR
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/MrrResponse' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/mrr/historico:
    get:
      tags: [mrr-dashboard]
      operationId: verHistoricoMrr
      summary: MRR dos últimos meses
      description: Exige `financeiro.dashboard.ver`. Os `meses` períodos até `ate` (padrão o mês atual).
      parameters:
        - name: ate
          in: query
          schema: { type: string, example: '2026-09', pattern: '^\d{4}-\d{2}$' }
        - name: meses
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      responses:
        '200':
          description: MRR por período, do mais antigo ao mais recente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MrrResponse' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/dashboard:
    get:
      tags: [mrr-dashboard]
      operationId: verDashboard
      summary: Indicadores da home do financeiro
      description: Exige `financeiro.dashboard.ver` (RN-46).
      responses:
        '200':
          description: Indicadores agregados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/DashboardFinanceiro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/auditoria:
    get:
      tags: [auditoria]
      operationId: listarAuditoria
      summary: Consultar a auditoria das alterações
      description: >
        Exige `financeiro.auditoria.ver` (RN-68). Registros somente de inserção: a aplicação não
        altera nem apaga (RN-67).
      parameters:
        - name: entidade
          in: query
          schema: { type: string, enum: [cobranca, pagamento, conta_pagar, recorrencia, regua, promessa_pagamento, webhook_evento] }
        - name: registroId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de registros, do mais recente ao mais antigo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/RegistroAuditoria' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/empresas/{empresaId}/status-financeiro:
    parameters:
      - name: empresaId
        in: path
        required: true
        description: UUID da empresa no CRM (o mesmo `clienteId` das cobranças)
        schema: { type: string, format: uuid }
    get:
      tags: [integracoes]
      operationId: statusFinanceiroDaEmpresa
      summary: O status financeiro mostrado na ficha de empresa do CRM
      description: >
        Exige `financeiro.cobranca.ver_resumo` (Contrato §9.3, §10.4). Sempre responde 200, mesmo sem
        cobrança (RN-53): empresa sem cobrança volta `situacao: sem_cobranca`. Não expõe valor nem
        forma de pagamento (RN-55).
      responses:
        '200':
          description: Status financeiro
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/StatusFinanceiro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/financeiro/empresas/status-financeiro:
    get:
      tags: [integracoes]
      operationId: statusFinanceiroEmLote
      summary: Status financeiro de várias empresas de uma vez
      description: >
        Exige `financeiro.cobranca.ver_resumo`. Máximo 100 ids (Contrato §9.4); 101 responde 400.
        Devolve um item para cada id pedido, na mesma ordem, mesmo sem cobrança.
      parameters:
        - name: ids
          in: query
          required: true
          schema: { type: array, items: { type: string, format: uuid }, maxItems: 100 }
          style: form
          explode: false
      responses:
        '200':
          description: Status financeiro de cada empresa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StatusFinanceiro' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token emitido pelo serviço de identidade (Grupo 2), validado localmente via JWKS. Claims
        relevantes: sub, tenant_id, roles, perms. Token de serviço (sub = svc:{modulo}) leva o
        tenant no cabeçalho X-Tenant-Id.

  headers:
    LocationPagamento:
      description: Endereço da solicitação de pagamento criada (§8.4)
      schema: { type: string, example: /api/financeiro/pagamentos/8e9f0a1b-2c3d-4e5f-9a6b-7c8d9e0f1a2b }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    DadosInvalidos:
      description: Dado inválido — ver campo `errors`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: 'Valor monetário com mais de 2 casas decimais: nada foi gravado.'
            errors:
              - { campo: valor, codigo: PRECISAO_EXCEDIDA, detalhe: no máximo 2 casas decimais }
    NaoAutenticado:
      description: Sem token, token inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    SemPermissao:
      description: Autenticado, mas sem a permissão necessária (conferida antes de ler o corpo)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant (nunca retorna 403 nesse caso)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Conflito:
      description: Estado do registro não permite a operação, ou duplicidade (código em `errors[0].codigo`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: 'Cobrança com pagamento parcial: o valor original e a empresa não mudam; só o saldo em aberto é editável.'
            errors:
              - { campo: null, codigo: EDICAO_NAO_PERMITIDA, detalhe: 'Cobrança com pagamento parcial: o valor original e a empresa não mudam; só o saldo em aberto é editável.' }
    RegraDeNegocio:
      description: Bem formado, mas viola regra de negócio (código em `errors[0].codigo`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: [string, 'null'], example: null }
        errors:
          type: array
          items:
            type: object
            required: [campo, codigo, detalhe]
            properties:
              campo: { type: [string, 'null'] }
              codigo: { type: string }
              detalhe: { type: string }
          example: []

    Pagina:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens: { type: array, items: {} }
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        total: { type: integer, example: 137 }

    ResultadoBusca:
      type: object
      required: [id, titulo, subtitulo, rota]
      description: Formato padrão da busca global, igual em todo módulo.
      properties:
        id: { type: string, format: uuid }
        titulo: { type: string, example: 'Cobrança #3a7e91b0 — Suporte mensal' }
        subtitulo: { type: string, example: 'Vence em 10/09/2026 · R$ 1.490,00 · ABERTO' }
        rota: { type: string, example: '/cobrancas/3a7e91b0-c1d2-4e5f-8a9b-1c2d3e4f5a6b', description: 'Relativa ao urlFrontend do módulo (/modulos/financeiro/).' }

    StatusFinanceiro:
      type: object
      description: >
        Um dos quatro status da ficha de empresa (Contrato §10.4); dono é o Financeiro. Resumo sem
        valores nem forma de pagamento — é o que a permissão fraca `financeiro.cobranca.ver_resumo`
        pode ver.
      required: [empresaId, situacao, cobrancasEmAtraso]
      properties:
        empresaId: { type: string, format: uuid }
        situacao:
          type: string
          enum: [sem_cobranca, ok, atencao, critico]
          description: >-
            sem_cobranca: nenhuma cobrança em aberto · ok: cobranças em aberto, nenhuma vencida ·
            atencao: alguma vencida há até 30 dias · critico: alguma vencida há mais de 30 dias
            (alinhado à etapa D+30 da régua, PD-9)
        cobrancasEmAtraso: { type: integer, minimum: 0, example: 1 }
        diasMaiorAtraso: { type: [integer, 'null'], minimum: 1, example: 12 }
        proximoVencimento: { type: [string, 'null'], format: date, example: '2026-10-10' }

    StatusCobranca:
      type: string
      enum: [ABERTO, AGENDADO, PAGO, ATRASADO, CANCELADO, ESTORNADO, PARCIAL]

    MeioPagamento:
      type: string
      enum: [PIX, BOLETO, CARTAO, TRANSFERENCIA]

    Cobranca:
      type: object
      required: [id, tenantId, clienteId, competencia, vencimento, valor, valorPago, saldo, status]
      properties:
        id: { type: string, format: uuid, example: 3a7e91b0-c1d2-4e5f-8a9b-1c2d3e4f5a6b }
        tenantId: { type: string, format: uuid }
        clienteId: { type: string, format: uuid, description: UUID da empresa no CRM (Grupo 6) — sem dado duplicado da empresa }
        contratoId: { type: [string, 'null'], format: uuid, description: UUID do módulo Contratos (Grupo 5) }
        recorrenciaId: { type: [string, 'null'], format: uuid, description: 'Regra que gerou a cobrança, se recorrente' }
        competencia: { type: string, format: date, example: '2026-09-01', description: Primeiro dia do mês de competência }
        vencimento: { type: string, format: date, example: '2026-09-10' }
        descricao: { type: [string, 'null'], maxLength: 200 }
        valor: { type: number, example: 1490.00, multipleOf: 0.01 }
        desconto: { type: number, default: 0, multipleOf: 0.01 }
        juros: { type: number, default: 0, multipleOf: 0.01 }
        multa: { type: number, default: 0, multipleOf: 0.01 }
        valorPago: { type: number, default: 0, multipleOf: 0.01 }
        saldo: { type: number, multipleOf: 0.01, description: valor − desconto + juros + multa − valorPago }
        formaPagamento:
          oneOf:
            - $ref: '#/components/schemas/MeioPagamento'
            - type: 'null'
        status: { $ref: '#/components/schemas/StatusCobranca' }
        diasAtraso: { type: integer, minimum: 0, description: 'Dias desde o vencimento, para cobrança em aberto' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time, example: null }

    CobrancaEntrada:
      type: object
      required: [clienteId, competencia, vencimento, valor]
      description: Qualquer `tenantId` enviado é ignorado; o tenant é o do token.
      properties:
        clienteId: { type: string, format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        competencia: { type: string, format: date, description: Qualquer dia do mês; vale o mês }
        vencimento: { type: string, format: date }
        valor: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        desconto: { type: number, minimum: 0, default: 0, multipleOf: 0.01 }
        juros: { type: number, minimum: 0, default: 0, multipleOf: 0.01, description: 'Regra automática de juros e multa: PD-8' }
        multa: { type: number, minimum: 0, default: 0, multipleOf: 0.01 }
        descricao: { type: [string, 'null'], maxLength: 200 }
        formaPagamento:
          oneOf:
            - $ref: '#/components/schemas/MeioPagamento'
            - type: 'null'

    BaixaManualEntrada:
      type: object
      required: [valor]
      properties:
        valor: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, description: Até o saldo em aberto; menor leva a PARCIAL }
        dataPagamento: { type: [string, 'null'], format: date, description: Padrão hoje; não pode ser futura }
        comprovanteId: { type: [string, 'null'], format: uuid, description: Documento no serviço do Grupo 5 }

    ContaPagar:
      type: object
      required: [id, tenantId, fornecedorNome, competencia, vencimento, valor, status, aprovado]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        fornecedorNome: { type: string, example: Distribuidora XYZ }
        fornecedorDocumento: { type: [string, 'null'], example: '12.345.678/0001-90' }
        categoria: { type: [string, 'null'], maxLength: 60, description: Texto livre até haver cadastro (PD-5) }
        centroCusto: { type: [string, 'null'], maxLength: 60 }
        competencia: { type: string, format: date }
        vencimento: { type: string, format: date }
        valor: { type: number, multipleOf: 0.01 }
        documento: { type: [string, 'null'], example: NF-4521 }
        observacoes: { type: [string, 'null'] }
        status: { type: string, enum: [PENDENTE, APROVADA, PAGA, CANCELADA] }
        aprovado: { type: boolean, default: false }
        aprovadoPor: { type: [string, 'null'], format: uuid }
        aprovadoEm: { type: [string, 'null'], format: date-time }
        dataPagamento: { type: [string, 'null'], format: date }
        valorPago: { type: [number, 'null'], multipleOf: 0.01 }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    ContaPagarEntrada:
      type: object
      required: [fornecedorNome, competencia, vencimento, valor]
      properties:
        fornecedorNome: { type: string, maxLength: 150 }
        fornecedorDocumento: { type: [string, 'null'], maxLength: 18 }
        categoria: { type: [string, 'null'], maxLength: 60 }
        centroCusto: { type: [string, 'null'], maxLength: 60 }
        competencia: { type: string, format: date }
        vencimento: { type: string, format: date }
        valor: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        documento: { type: [string, 'null'], maxLength: 60 }
        observacoes: { type: [string, 'null'], maxLength: 500 }

    PagamentoContaEntrada:
      type: object
      properties:
        valorPago: { type: [number, 'null'], exclusiveMinimum: 0, multipleOf: 0.01, description: Padrão = valor da conta }
        dataPagamento: { type: [string, 'null'], format: date, description: Padrão hoje; não pode ser futura }

    ItemRecorrencia:
      type: object
      required: [servicoId, descricao, quantidade, unidade, valorUnitario]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        servicoId: { type: string, format: uuid, description: UUID do módulo Produtos e Serviços (Grupo 1) }
        descricao: { type: string, example: Backup em nuvem }
        quantidade: { type: number, exclusiveMinimum: 0, example: 500, multipleOf: 0.001 }
        unidade: { type: string, example: GB }
        valorUnitario: { type: number, minimum: 0, example: 1.20, multipleOf: 0.01 }
        franquia: { type: [number, 'null'], example: 400, description: 'Limite antes de gerar excedente (cobrança do excedente: RN-18, PD-7)' }
        total: { type: number, readOnly: true, multipleOf: 0.01 }
        vigenteDesde: { type: string, format: date, readOnly: true }
        vigenteAte: { type: [string, 'null'], format: date, readOnly: true }

    RegraRecorrencia:
      type: object
      required: [id, tenantId, clienteId, periodicidade, diaGeracao, itens, ativa]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        clienteId: { type: string, format: uuid }
        descricao: { type: [string, 'null'] }
        periodicidade: { type: string, enum: [MENSAL, TRIMESTRAL, ANUAL], default: MENSAL }
        diaGeracao: { type: integer, minimum: 1, maximum: 28, example: 5 }
        diasParaVencimento: { type: integer, minimum: 0, maximum: 60, default: 10 }
        formaPagamento:
          oneOf:
            - $ref: '#/components/schemas/MeioPagamento'
            - type: 'null'
        proximaCompetencia: { type: string, format: date }
        valorProximoCiclo: { type: number, multipleOf: 0.01, description: Soma dos itens vigentes na próxima geração (RN-14) }
        itens: { type: array, items: { $ref: '#/components/schemas/ItemRecorrencia' }, description: Itens vigentes na próxima geração }
        ativa: { type: boolean, default: true }
        vigenciaInicio: { type: string, format: date }
        vigenciaFim: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }

    RegraRecorrenciaEntrada:
      type: object
      required: [clienteId, itens]
      properties:
        contratoId: { type: [string, 'null'], format: uuid, description: Opcional enquanto o Contratos não publica a assinatura }
        clienteId: { type: string, format: uuid }
        descricao: { type: [string, 'null'], maxLength: 200 }
        periodicidade: { type: string, enum: [MENSAL, TRIMESTRAL, ANUAL], default: MENSAL }
        diaGeracao: { type: integer, minimum: 1, maximum: 28, default: 5 }
        diasParaVencimento: { type: integer, minimum: 0, maximum: 60, default: 10 }
        formaPagamento:
          oneOf:
            - $ref: '#/components/schemas/MeioPagamento'
            - type: 'null'
        ativa: { type: [boolean, 'null'], description: false encerra a regra; true reativa }
        itens: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ItemRecorrencia' } }

    PagamentoSolicitado:
      type: object
      required: [pagamentoId, cobrancaId, meio, status, valor]
      description: >
        Resposta neutra do adaptador de provedor (RN-19) — o mesmo formato com provedor real ou
        simulado; nenhum detalhe do provedor é exposto.
      properties:
        pagamentoId: { type: string, format: uuid }
        cobrancaId: { type: string, format: uuid }
        meio: { $ref: '#/components/schemas/MeioPagamento' }
        status: { type: string, enum: [PENDENTE, PROCESSANDO, CONFIRMADO, ESTORNADO, FALHOU, EXPIRADO] }
        valor: { type: number, multipleOf: 0.01 }
        pixCopiaCola: { type: [string, 'null'], description: Presente apenas quando meio = PIX }
        pixQrCode: { type: [string, 'null'], description: 'Imagem PNG do QR code em data URI, enquanto pendente' }
        boletoUrl: { type: [string, 'null'], description: Presente apenas quando meio = BOLETO }
        boletoLinhaDigitavel: { type: [string, 'null'] }
        linkPagamentoCartao: { type: [string, 'null'], description: Presente apenas quando meio = CARTAO }
        expiraEm: { type: [string, 'null'], format: date-time }
        confirmadoEm: { type: [string, 'null'], format: date-time }
        comprovanteId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    WebhookPagamentoEntrada:
      type: object
      required: [eventoId, assinatura, tipo, cobrancaId]
      description: Payload recebido do provedor (formato do adaptador simulado nesta fase).
      properties:
        eventoId: { type: string, maxLength: 100, description: ID único do evento no provedor — usado para idempotência }
        assinatura: { type: string, description: 'HMAC-SHA256 hex de eventoId|tipo|cobrancaId|valorPago' }
        tipo: { type: string, enum: [pagamento.confirmado, pagamento.estornado, pagamento.falhou] }
        cobrancaId: { type: string, format: uuid }
        pagamentoId: { type: [string, 'null'], format: uuid, description: Pedido a que o evento se refere; sem ele vale o pendente mais recente }
        valorPago: { type: [number, 'null'], exclusiveMinimum: 0, multipleOf: 0.01 }
        dataPagamento: { type: [string, 'null'], format: date-time }

    ReguaEtapa:
      type: object
      required: [diasOffset, canal, templateMensagem]
      properties:
        id: { type: [string, 'null'], format: uuid, description: Ausente na entrada = etapa nova }
        diasOffset: { type: integer, minimum: -60, maximum: 120, example: -5, description: 'Negativo = antes do vencimento, positivo = depois' }
        acao: { type: [string, 'null'], maxLength: 60, example: lembrete }
        canal: { type: string, enum: [EMAIL, WHATSAPP, NOTIFICACAO_INTERNA], description: 'WhatsApp sem canal efetivo nesta fase (RN-37)' }
        templateMensagem:
          type: string
          minLength: 1
          example: 'Sua fatura de {valor} vence em {vencimento}.'
          description: 'Variáveis: {valor}, {saldo}, {vencimento}, {dias}, {descricao}, {cobranca}'
        ativa: { type: boolean, default: true }

    ReguaCobranca:
      type: object
      required: [etapas]
      properties:
        etapas: { type: array, items: { $ref: '#/components/schemas/ReguaEtapa' } }

    Disparo:
      type: object
      required: [id, cobrancaId, etapaId, diasOffset, canal, situacao, disparadoEm]
      properties:
        id: { type: string, format: uuid }
        cobrancaId: { type: string, format: uuid }
        etapaId: { type: string, format: uuid }
        diasOffset: { type: integer }
        canal: { type: string, enum: [EMAIL, WHATSAPP, NOTIFICACAO_INTERNA] }
        situacao:
          type: string
          enum: [SOLICITADO, SEM_DESTINATARIO, CANAL_INDISPONIVEL]
          description: SOLICITADO = pedido enviado à plataforma por identity.entrada (RN-33)
        disparadoEm: { type: string, format: date-time }

    ExecucaoRegua:
      type: object
      required: [marcadasAtrasadas, eventosDeAtraso, disparos, promessasQuebradas]
      properties:
        marcadasAtrasadas: { type: integer }
        eventosDeAtraso: { type: integer }
        disparos: { type: integer }
        promessasQuebradas: { type: integer }

    FaixaAging:
      type: string
      enum: ['1-5', '6-15', '16-30', '31-60', '61-90', '90+']

    ItemInadimplencia:
      type: object
      required: [cobrancaId, clienteId, vencimento, diasAtraso, faixa, saldoDevedor]
      properties:
        cobrancaId: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        vencimento: { type: string, format: date }
        diasAtraso: { type: integer, example: 22 }
        faixa: { $ref: '#/components/schemas/FaixaAging' }
        saldoDevedor: { type: number, example: 890.00, multipleOf: 0.01 }
        status: { $ref: '#/components/schemas/StatusCobranca' }
        descricao: { type: [string, 'null'] }

    InadimplenciaResponse:
      type: object
      required: [itens, totalPorFaixa]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/ItemInadimplencia' } }
        totalPorFaixa:
          type: object
          additionalProperties: { type: number }
          example: { '1-5': 3200.00, '6-15': 1490.00, '16-30': 890.00, '31-60': 0, '61-90': 0, '90+': 0 }
        empresas:
          type: array
          items:
            type: object
            properties:
              clienteId: { type: string, format: uuid }
              cobrancas: { type: integer }
              maiorAtraso: { type: integer }
              saldoDevedor: { type: number, multipleOf: 0.01 }
        total: { type: number, multipleOf: 0.01 }
        pagina: { type: integer }
        tamanho: { type: integer }
        totalItens: { type: integer }

    PromessaEntrada:
      type: object
      required: [dataPrometida, valor]
      properties:
        dataPrometida: { type: string, format: date }
        valor: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        observacao: { type: [string, 'null'], maxLength: 500 }

    Promessa:
      type: object
      required: [id, cobrancaId, dataPrometida, valor, status]
      properties:
        id: { type: string, format: uuid }
        cobrancaId: { type: string, format: uuid }
        dataPrometida: { type: string, format: date }
        valor: { type: number, multipleOf: 0.01 }
        observacao: { type: [string, 'null'] }
        status: { type: string, enum: [PENDENTE, CUMPRIDA, QUEBRADA] }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }

    HistoricoEmpresa:
      type: object
      required: [clienteId, cobrancas, pagamentos, disparos, promessas]
      properties:
        clienteId: { type: string, format: uuid }
        cobrancas: { type: array, items: { $ref: '#/components/schemas/Cobranca' } }
        pagamentos: { type: array, items: { $ref: '#/components/schemas/PagamentoSolicitado' } }
        disparos: { type: array, items: { $ref: '#/components/schemas/Disparo' } }
        promessas: { type: array, items: { $ref: '#/components/schemas/Promessa' } }

    MrrResponse:
      type: object
      required: [periodo, mrrNovo, mrrExpansion, mrrContraction, mrrChurned, mrrNetNew, mrrTotal]
      properties:
        periodo: { type: string, example: '2026-09' }
        mrrNovo: { type: number, multipleOf: 0.01 }
        mrrExpansion: { type: number, multipleOf: 0.01 }
        mrrContraction: { type: number, multipleOf: 0.01 }
        mrrChurned: { type: number, multipleOf: 0.01 }
        mrrNetNew: { type: number, multipleOf: 0.01 }
        mrrTotal: { type: number, multipleOf: 0.01 }
        mrrInicial: { type: number, multipleOf: 0.01, description: MRR do mês anterior }
        arr: { type: number, multipleOf: 0.01, description: MRR × 12 (RN-47) }
        empresasAtivas: { type: integer }
        empresasNoInicio: { type: integer }
        empresasCanceladas: { type: integer }
        logoChurn: { type: number, description: Pontos percentuais (RN-48) }
        mrrChurn: { type: number, description: Pontos percentuais }
        revenueChurn: { type: number, description: 'Pontos percentuais; inclui contraction' }

    DashboardFinanceiro:
      type: object
      required: [aReceberHoje, atrasados, pagamentosRecebidosMes, contasAPagarMes, inadimplenciaTotal]
      properties:
        aReceberHoje: { type: number, multipleOf: 0.01 }
        atrasados: { type: number, multipleOf: 0.01, description: Saldo das cobranças em ATRASADO }
        pagamentosRecebidosMes: { type: number, multipleOf: 0.01 }
        contasAPagarMes: { type: number, multipleOf: 0.01 }
        inadimplenciaTotal: { type: number, multipleOf: 0.01, description: Saldo de todas as vencidas em aberto }
        cobrancasEmAberto: { type: integer }
        cobrancasAtrasadas: { type: integer }
        mrrAtual: { type: number, multipleOf: 0.01 }
        arr: { type: number, multipleOf: 0.01 }

    RegistroAuditoria:
      type: object
      required: [id, dataHora, acao, entidade, registroId]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: [string, 'null'], format: uuid, description: Nulo em rotina automática }
        servico: { type: [string, 'null'], example: 'svc:contratos' }
        ip: { type: [string, 'null'] }
        dataHora: { type: string, format: date-time }
        acao: { type: string, example: EDITAR }
        entidade: { type: string, example: cobranca }
        registroId: { type: string, format: uuid }
        valorAnterior: { type: [object, 'null'] }
        valorNovo: { type: [object, 'null'] }
