asyncapi: 3.0.0
info:
  title: Financeiro — eventos publicados
  version: 0.3.0
  description: |
    Eventos que o módulo Financeiro publica na exchange `financeiro.eventos`, do tipo
    topic, com o tipo do evento como chave de roteamento (Contrato de Integração §9.7).
    Publica com o usuário `mq_financeiro` e sempre depois do commit da transação que
    produziu o fato. Quem consome cria a própria fila e a liga a esta exchange.

    Origem de cada evento:
    - `financeiro.cobranca.criada`: lançamento avulso (`POST /api/financeiro/cobrancas`)
      ou geração pela recorrência (job ou `POST .../recorrencias/{id}/gerar-cobranca`).
    - `financeiro.pagamento.confirmado`: webhook do provedor
      (`POST /public/financeiro/webhooks/pagamento`) ou baixa manual
      (`POST /api/financeiro/cobrancas/{id}/baixas`, RF-12).
    - `financeiro.pagamento.falhou`: recusa ou estorno informado pelo provedor. Estorno sai como
      `falhou`, com `motivo: ESTORNADO`.
    - `financeiro.pagamento.atrasado`: job diário da régua, uma única vez por cobrança vencida
      (RN-06).

    Os eventos passam por um outbox (`financeiro.eventos_outbox`): gravados na transação do fato e
    publicados depois do commit, com confirmação do broker.

    `clienteId` e `empresaId` são o mesmo UUID da empresa no CRM; `empresaId` foi acrescentado na
    0.3.0 para alinhar com a EOR. Campos novos são opcionais: a `versao` continua 1.

    **Consumidos** (o Grupo 5 ainda não publicou o AsyncAPI do Contratos; formato esperado de
    `dados`, a confirmar com ele):
    - `contratos.contrato.assinado` → fila `financeiro.contrato-assinado`: cria a regra de
      recorrência, idempotente pelo `id` do envelope. `dados`: `contratoId`, `empresaId`,
      `itens[]` (`servicoId`, `descricao`, `quantidade`, `unidade`, `valorUnitario`, `franquia`),
      opcionais `periodicidade`, `diaGeracao`, `formaPagamento`, `descricao`.
    - `contratos.contrato.cancelado` → fila `financeiro.contrato-cancelado`: encerra a regra; o
      valor entra como churn no MRR do mês. `dados`: `contratoId`, opcional `canceladoEm`.
    Ambas com `.dlq` (exchange `financeiro.dlx`) depois de três falhas.

    **Pedidos à plataforma** em `identity.entrada` (RN-33): `identity.timeline.registrar` a cada
    pagamento, estorno e aviso da régua; `identity.notificacao.criar` (COBRANCA_PAGA,
    COBRANCA_VENCIDA) para quem lançou a cobrança; `identity.email.enviar` com o modelo
    `financeiro.cobranca-regua` (arquivo `emails/financeiro/cobranca-regua.txt`; variáveis `mensagem`,
    `valor`, `vencimento`, `etapa`). Toda mensagem sai com `user_id = mq_financeiro`.
defaultContentType: application/json

servers:
  desenvolvimento:
    host: localhost:5672
    protocol: amqp
    protocolVersion: 0.9.1
    description: RabbitMQ do infra-integrador-2026, vhost `plataforma`

channels:
  eventos:
    address: financeiro.eventos
    messages:
      cobrancaCriada:
        $ref: '#/components/messages/CobrancaCriada'
      pagamentoConfirmado:
        $ref: '#/components/messages/PagamentoConfirmado'
      pagamentoAtrasado:
        $ref: '#/components/messages/PagamentoAtrasado'
      pagamentoFalhou:
        $ref: '#/components/messages/PagamentoFalhou'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: financeiro.eventos
          type: topic
          durable: true
          autoDelete: false
          vhost: plataforma
        bindingVersion: 0.3.0

operations:
  publicarCobrancaCriada:
    action: send
    summary: Uma cobrança foi lançada (avulsa ou por recorrência)
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/cobrancaCriada'
  publicarPagamentoConfirmado:
    action: send
    summary: Pagamento de uma cobrança confirmado (webhook do provedor ou baixa manual)
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/pagamentoConfirmado'
  publicarPagamentoAtrasado:
    action: send
    summary: Uma cobrança venceu sem pagamento
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/pagamentoAtrasado'
  publicarPagamentoFalhou:
    action: send
    summary: O provedor rejeitou ou estornou um pagamento
    channel:
      $ref: '#/channels/eventos'
    messages:
      - $ref: '#/channels/eventos/messages/pagamentoFalhou'

components:
  messages:
    CobrancaCriada:
      name: financeiro.cobranca.criada
      title: Cobrança criada
      summary: Publicado depois do commit do lançamento da cobrança.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: financeiro.cobranca.criada }
              dados:
                type: object
                required: [cobrancaId, clienteId, valor, vencimento]
                properties:
                  cobrancaId: { type: string, format: uuid }
                  clienteId: { type: string, format: uuid, description: UUID da empresa no CRM }
                  empresaId: { type: string, format: uuid, description: Igual a clienteId }
                  contratoId: { type: [string, 'null'], format: uuid }
                  valor: { type: number, multipleOf: 0.01, minimum: 0, example: 1490.00 }
                  vencimento: { type: string, format: date, example: '2026-10-10' }

    PagamentoConfirmado:
      name: financeiro.pagamento.confirmado
      title: Pagamento confirmado
      summary: Publicado depois do commit do webhook de pagamento ou da baixa manual.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: financeiro.pagamento.confirmado }
              dados:
                type: object
                required: [cobrancaId, clienteId, valorPago]
                properties:
                  pagamentoId: { type: string, format: uuid }
                  cobrancaId: { type: string, format: uuid }
                  clienteId: { type: string, format: uuid }
                  empresaId: { type: string, format: uuid }
                  valorPago: { type: number, multipleOf: 0.01, minimum: 0, example: 1490.00 }
                  meio: { type: string, enum: [PIX, BOLETO, CARTAO, TRANSFERENCIA] }
                  statusCobranca: { type: string, enum: [PAGO, PARCIAL] }
                  saldo: { type: number, multipleOf: 0.01, minimum: 0, description: Saldo restante da cobrança }

    PagamentoAtrasado:
      name: financeiro.pagamento.atrasado
      title: Pagamento atrasado
      summary: Publicado pelo job da régua de cobrança quando uma cobrança vence sem pagamento.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: financeiro.pagamento.atrasado }
              dados:
                type: object
                required: [cobrancaId, clienteId, vencimento]
                properties:
                  cobrancaId: { type: string, format: uuid }
                  clienteId: { type: string, format: uuid }
                  empresaId: { type: string, format: uuid }
                  vencimento: { type: string, format: date }
                  diasAtraso: { type: integer, minimum: 1 }
                  saldoDevedor: { type: number, multipleOf: 0.01, minimum: 0 }

    PagamentoFalhou:
      name: financeiro.pagamento.falhou
      title: Pagamento falhou
      summary: Publicado quando o provedor rejeita ou estorna um pagamento.
      payload:
        allOf:
          - $ref: '#/components/schemas/Envelope'
          - type: object
            properties:
              tipo: { const: financeiro.pagamento.falhou }
              dados:
                type: object
                required: [cobrancaId, clienteId, motivo]
                properties:
                  pagamentoId: { type: string, format: uuid }
                  cobrancaId: { type: string, format: uuid }
                  clienteId: { type: string, format: uuid }
                  empresaId: { type: string, format: uuid }
                  statusCobranca: { type: string, enum: [ABERTO, AGENDADO, ATRASADO, PARCIAL, PAGO, ESTORNADO] }
                  motivo: { type: string, enum: [REJEITADO, ESTORNADO] }
                  valorPago:
                    type: [number, 'null']
                    multipleOf: 0.01
                    description: Valor estornado, quando motivo = ESTORNADO

  schemas:
    Envelope:
      type: object
      required: [id, tipo, versao, tenantId, moduloOrigem, ocorridoEm, dados]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string }
        versao: { type: integer, minimum: 1 }
        tenantId: { type: string, format: uuid }
        moduloOrigem: { type: string }
        ocorridoEm: { type: string, format: date-time }
        usuarioId: { type: [string, 'null'], format: uuid }
        correlacaoId: { type: [string, 'null'] }
        dados: { type: object }
